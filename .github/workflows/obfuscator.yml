name: 混淆 _worker 目录

on:
  workflow_dispatch:
  push:
    paths:
      - _worker/**

concurrency:
  group: obfuscate-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache npm global directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-obfuscator-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-obfuscator-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Prepare output directory
        run: mkdir -p obfuscated

      - name: Collect changed worker files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find _worker -type f | sort > changed_files.txt
            : > deleted_files.txt
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"

            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              git ls-tree -r --name-only "$AFTER_SHA" -- _worker > changed_files.txt
              : > deleted_files.txt
            else
              # 使用 --no-renames 确保重命名的文件被正确识别为 "删除旧文件" + "创建新文件"
              git diff --no-renames --diff-filter=AMR --name-only "$BEFORE_SHA" "$AFTER_SHA" -- _worker | sort -u > changed_files.txt
              git diff --no-renames --diff-filter=D --name-only "$BEFORE_SHA" "$AFTER_SHA" -- _worker | sort -u > deleted_files.txt
            fi
          fi

          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "=== 本次需要混淆的文件 ==="
            cat changed_files.txt
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "没有新增或修改的 _worker 文件"
          fi

          if [ -s deleted_files.txt ]; then
            echo "=== 本次需要清理的已删除文件 ==="
            cat deleted_files.txt
          fi

      # 优化点：直接调用统一的 node obfuscate.js 增量参数，简化 Shell 代码
      - name: Obfuscate changed worker files
        if: steps.changed_files.outputs.has_changes == 'true'
        run: xargs node obfuscate.js < changed_files.txt

      # 优化点：直接调用统一的 node obfuscate.js --delete 清理参数，简化 Shell 代码
      - name: Remove deleted worker outputs
        run: |
          if [ -s deleted_files.txt ]; then
            xargs node obfuscate.js --delete < deleted_files.txt
          fi

      - name: Commit obfuscated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A obfuscated
          if git diff --cached --quiet; then
            echo "没有新的混淆产物变更，跳过提交"
            exit 0
          fi
          git commit -m "build: update obfuscated worker files [skip ci]"

      - name: Push changes
        run: |
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
